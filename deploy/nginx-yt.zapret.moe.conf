# yt-grab — yt.zapret.moe
# Устанавливается в /etc/nginx/sites-available/ и линкуется в sites-enabled/.

# Ограничение частоты на уровне nginx (вдобавок к лимитам в приложении).
limit_req_zone $binary_remote_addr zone=ytgrab_api:10m rate=30r/m;
limit_conn_zone $binary_remote_addr zone=ytgrab_conn:10m;

server {
    listen 80;
    listen [::]:80;
    server_name yt.zapret.moe;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 301 https://yt.zapret.moe$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name yt.zapret.moe;

    ssl_certificate     /etc/letsencrypt/live/yt.zapret.moe/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yt.zapret.moe/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;

    charset utf-8;

    # Загрузок от клиента нет — тело запроса всегда маленький JSON.
    client_max_body_size 64k;

    # Не более 8 одновременных соединений с одного IP
    # (SSE держит соединение открытым, поэтому не слишком строго).
    limit_conn ytgrab_conn 8;

    # --- Поток прогресса (SSE): буферизация должна быть выключена ---
    location ~ ^/api/tasks/[^/]+/progress$ {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        gzip off;
        chunked_transfer_encoding on;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # --- Отдача готового файла: большие тела, докачка по Range ---
    location ~ ^/api/tasks/[^/]+/file$ {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # не копить многогигабайтные ответы во временные файлы
        proxy_buffering off;
        proxy_max_temp_file_size 0;
        proxy_read_timeout 1h;
    }

    # --- Остальное API: с ограничением частоты ---
    location /api/ {
        limit_req zone=ytgrab_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
